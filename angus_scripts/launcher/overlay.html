<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>Launcher</title>
  <style>
    :root {
      --bg: #1c1410;
      --text: #f4f1ec;
      --muted: rgba(244, 241, 236, 0.46);
      --copper: #e3a46c;
      --line: rgba(227, 164, 108, 0.28);
      --row: rgba(255, 236, 214, 0.045);
      --row-on: rgba(227, 164, 108, 0.16);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
    }

    #shell {
      position: relative;
      width: 100%;
      height: 100%;
      background: rgba(8, 5, 4, 0.28);
    }

    /* Step 1: solid card only. Glass/blur comes later. */
    #card {
      position: absolute;
      top: 17vh;
      left: 50%;
      width: min(520px, calc(100vw - 48px));
      padding: 14px 14px 10px;
      border-radius: 18px;
      background: var(--bg);
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      transform: translateX(-50%);
      overflow: hidden;
    }

    .search {
      display: flex;
      align-items: center;
      height: 48px;
      padding: 0 8px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 8px;
    }

    #q {
      flex: 1;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.02em;
      caret-color: var(--copper);
      user-select: text;
    }

    #results { max-height: 360px; overflow: auto; }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 40px;
      padding: 0 10px;
      border-radius: 10px;
      background: var(--row);
      margin-bottom: 4px;
    }

    .row.is-on { background: var(--row-on); }

    .glyph {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: rgba(227, 164, 108, 0.14);
      color: var(--copper);
      font-size: 13px;
      font-weight: 600;
      flex: 0 0 28px;
    }

    .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
    }

    .key {
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 6px;
    }

    #empty {
      padding: 18px 10px;
      color: var(--muted);
      font-size: 14px;
    }

    #empty[hidden], #results[hidden] { display: none; }

    .foot {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      padding: 4px 6px 2px;
      color: var(--muted);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="shell">
    <div id="card">
      <div class="search">
        <input id="q" type="text" placeholder="Launch" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus>
      </div>
      <div id="results"></div>
      <div id="empty" hidden>No matching apps</div>
      <div class="foot">
        <span id="hint-left">c  t  s  sp</span>
        <span id="hint-right">↵ open   esc dismiss</span>
      </div>
    </div>
  </div>
  <script>
    const q = document.getElementById("q");
    const results = document.getElementById("results");
    const empty = document.getElementById("empty");
    const hintLeft = document.getElementById("hint-left");

    let items = [];
    let selected = 0;
    let ready = false;
    let pending = null;

    function post(payload) {
      try { webkit.messageHandlers.launcherBridge.postMessage(payload); } catch (err) {}
    }

    function esc(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
      });
    }

    function render() {
      if (!items.length) {
        results.hidden = true;
        empty.hidden = false;
        empty.textContent = q.value ? 'Nothing for “‘ + q.value + '”' : "No matching apps";
        hintLeft.textContent = "no match";
        return;
      }
      empty.hidden = true;
      results.hidden = false;
      results.innerHTML = items.map(function (item, i) {
        const name = item.displayName || item.name || "?";
        const key = item.alias ? '<span class="key">' + esc(item.alias) + "</span>" : "";
        return '<div class="row' + (i === selected ? " is-on" : "") + '" data-i="' + i + '">' +
          '<div class="glyph">' + esc(name.charAt(0)) + "</div>" +
          '<div class="name">' + esc(name) + "</div>" + key +
          "</div>";
      }).join("");
      hintLeft.textContent = items.length + (items.length === 1 ? " app" : " apps");
      const node = results.querySelector('.row[data-i="' + selected + '"]');
      if (node && node.scrollIntoView) node.scrollIntoView({ block: "nearest" });
    }

    function apply(state) {
      if (!state) return;
      items = state.items || [];
      if (state.resetQuery) {
        q.value = state.query || "";
        selected = 0;
      } else {
        selected = 0;
      }
      if (selected >= items.length) selected = 0;
      render();
    }

    window.__setState = function (state) {
      if (!ready) { pending = state; return; }
      apply(state);
    };

    window.__focus = function () {
      q.focus();
      const value = q.value;
      q.setSelectionRange(value.length, value.length);
    };

    q.addEventListener("input", function () {
      post({ type: "query", query: q.value });
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        event.preventDefault();
        post({ type: "dismiss" });
        return;
      }
      if (event.key === "Enter") {
        event.preventDefault();
        if (items.length) post({ type: "select", index: selected + 1 });
        return;
      }
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        if (!items.length) return;
        selected = (selected + (event.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        render();
      }
    });

    document.getElementById("shell").addEventListener("mousedown", function (event) {
      if (event.target.id === "shell") post({ type: "dismiss" });
    });

    results.addEventListener("click", function (event) {
      const target = event.target.closest("[data-i]");
      if (!target) return;
      selected = Number(target.getAttribute("data-i"));
      post({ type: "select", index: selected + 1 });
    });

    ready = true;
    if (pending) { apply(pending); pending = null; }
  </script>
</body>
</html>
